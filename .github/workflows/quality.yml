name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  recommended-quality-gate:
    runs-on: macos-14
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Alire
        uses: alire-project/setup-alire@v6

      - name: Build
        run: alr build

      - name: Install GNATprove
        run: |
          alr install gnatprove
          echo "$HOME/.alire/bin" >> "$GITHUB_PATH"

      - name: Run precision regressions
        run: |
          sh tests/run_recommended.sh
          sh tests/run_recoverable_diagnostic.sh
          sh tests/run_bug_findings.sh
          sh tests/run_automotive.sh
          sh tests/run_gnatprove_differential.sh

      - name: Reject new recommended-profile findings
        run: sh tests/run_recommended_gate.sh

      - name: Verify release metrics
        run: sh tests/run_quality_metrics.sh
