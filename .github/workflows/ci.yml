name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # alire.toml pins MACOSX_DEPLOYMENT_TARGET and Apple SDK include/library
    # paths, so this crate only builds on macOS; there is no Linux runner
    # here to fall back to.
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Alire
        uses: alire-project/setup-alire@v6.0.0

      - name: Build
        run: alr -n build

      - name: Run test suite
        run: sh tests/run_all.sh
