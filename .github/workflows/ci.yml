name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Alire's dependencies are rebuilt in every run (22 to 37 minutes on
    # macOS) and the test suite takes about 50: 90 minutes cancelled a
    # macOS run on 2026-11-19 a few minutes before its end.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4
        with:
          version: "2.1.0"

      # Alire's shared cache holds fetched sources, unique dependency builds,
      # and downloaded toolchains keyed by lock file + environment, so most
      # runs only need to rebuild adalang_analyzer itself.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/alire
            ~/.alire
          key: alire-${{ runner.os }}-${{ hashFiles('alire.lock') }}
          restore-keys: |
            alire-${{ runner.os }}-

      # gnatcoll_gmp depends on the system "gmp" library. alr resolves this
      # correctly per-platform on its own (confirmed: a fresh `alr get
      # libgmp` on Ubuntu finds "libgmp-dev" via apt without help); the
      # actual failures here came from a committed alire/alire.lock that had
      # frozen this as the macOS-resolved "system:gmp", which does not exist
      # as an apt package. That lockfile is no longer committed (see
      # .gitignore), so this step is just a speed/determinism nicety.
      # `timeout` plus Acquire::*::Timeout/Retries bound this step to a few
      # minutes: seen in practice (2026-08-19) hanging for the full 60-minute
      # job timeout with no output after fetching the noble-security
      # InRelease file from the Azure mirror, which otherwise silently burns
      # the whole CI budget on a transient infra stall.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          timeout 120 sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
          sudo apt-get install -y libgmp-dev

      # --verify's SMT backend needs cvc5 and z3 on PATH or under Alire's
      # standard GNATprove installation prefix (~/.alire/libexec/spark/bin);
      # without them, tests/run_verification.sh's external-prover checks
      # fail silently under `set -eu`.
      - name: Install SPARK solvers
        run: alr -n install gnatprove

      # The macOS image of 2026-10-13 has the Command Line Tools of Xcode 27.
      # GCC links against their SDK, /Library/Developer/CommandLineTools/SDKs/
      # MacOSX.sdk, a path built into the compiler (SDKROOT does not change
      # it), and the linker of the selected Xcode 26 cannot read that SDK's
      # libSystem.tbd ("unknown architecture"): every C library symbol went
      # missing while libgpr2 was built. The same directory still holds the
      # macOS 26 SDK, which that linker reads, and the name is pointed at it.
      - name: Link against the macOS 26 SDK (macOS)
        if: runner.os == 'macOS'
        run: |
          sdks=/Library/Developer/CommandLineTools/SDKs
          ls -l "$sdks"
          if [ -L "$sdks/MacOSX.sdk" ] && [ -d "$sdks/MacOSX26.sdk" ]; then
            sudo ln -sfn MacOSX26.sdk "$sdks/MacOSX.sdk"
          fi
          ls -l "$sdks/MacOSX.sdk"

      - name: Build
        run: alr build

      - name: Run test suite
        # Shared CI runners are slower and noisier than a local machine, so
        # relax the performance smoke test's threshold to avoid flaky
        # failures unrelated to an actual regression. The test runs every
        # check: 30 s covered 127 of them (23 s on macOS); the 294 of 1.8.0
        # took 54 to 70 s there, and more have been added since. macOS runners
        # went 110, 125, 118, 135, 139, 158 and 140 s across the 1.12 releases
        # with the same 94 s locally: 150 s left no margin for runner noise.
        env:
          ADALANG_MAX_SMOKE_SECONDS: 180
        run: sh tests/run_all.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash

    steps:
      # The fixtures and the expected outputs are compared byte for byte, so
      # they are checked out as committed. Sources with CRLF line ends, as a
      # Windows checkout gives them, have a test of their own.
      - name: Keep line ends as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4
        with:
          version: "2.1.0"

      # Building langkit_support under Alire's default cache goes past
      # MAX_PATH: gprbuild hands ld a linker script whose path, relative to
      # an object directory about 185 characters deep, is longer than 260
      # characters, and ld cannot open it. The Alire index's own Windows CI
      # moves the cache to C:\temp\ac for that reason; the toolchain and
      # MSYS2 stay where setup-alire put them.
      - name: Move Alire's cache to a short path
        run: |
          mkdir -p 'C:\temp\ac'
          alr settings --global --set cache.dir 'C:\temp\ac'
          alr settings --global --set toolchain.dir "$LOCALAPPDATA\\alire\\cache\\toolchains"
          alr settings --global --set msys2.install_dir "$LOCALAPPDATA\\alire\\cache\\msys64"
          alr version

      # Git for Windows' tar takes "C:" in an archive name for a remote host;
      # Alire unpacks with the one MSYS2 provides.
      - name: Install tar from MSYS2
        run: |
          "$LOCALAPPDATA\\alire\\cache\\msys64\\usr\\bin\\pacman" --noconfirm -S tar

      # Restored here and saved after the build whether it succeeds or not:
      # the dependencies take about 25 minutes to build on Windows.
      - name: Restore Alire's builds
        id: alire-builds
        uses: actions/cache/restore@v4
        with:
          path: C:\temp\ac
          key: alire-builds-${{ runner.os }}-${{ hashFiles('alire.toml') }}-${{ github.run_id }}
          restore-keys: |
            alire-builds-${{ runner.os }}-${{ hashFiles('alire.toml') }}-
            alire-builds-${{ runner.os }}-

      - name: Install SPARK solvers
        run: alr -n install gnatprove

      # Built a second time as tests/run_all.sh builds, from sh: Alire
      # gave four of the dependencies other build hashes there, and the
      # test suite rebuilt them for 17 minutes in every run.
      - name: Build
        run: |
          alr build
          sh -c 'alr build'

      - name: Save Alire's builds
        if: always() && steps.alire-builds.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\temp\ac
          key: alire-builds-${{ runner.os }}-${{ hashFiles('alire.toml') }}-${{ github.run_id }}

      # The executable is linked statically: it has to run without the DLLs
      # of Alire's MSYS2, which only "alr exec" puts on the path.
      - name: Check that the executable needs no DLL of MSYS2
        run: |
          alr exec -- objdump -p bin/adalang_analyzer.exe | grep "DLL Name"
          if alr exec -- objdump -p bin/adalang_analyzer.exe | grep -i -E "DLL Name: lib(gmp|iconv|gcc|winpthread|gnat)"; then
            echo "the executable needs a DLL of MSYS2" >&2
            exit 1
          fi

      # Every script runs, so that one run lists every failure.
      - name: Run test suite
        env:
          ADALANG_MAX_SMOKE_SECONDS: 300
          ADALANG_TESTS_KEEP_GOING: 1
        run: sh tests/run_all.sh
