name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4
        with:
          version: "2.1.0"

      # Alire's shared cache holds fetched sources, unique dependency builds,
      # and downloaded toolchains keyed by lock file + environment, so most
      # runs only need to rebuild adalang_analyzer itself.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/alire
            ~/.alire
          key: alire-${{ runner.os }}-${{ hashFiles('alire.lock') }}
          restore-keys: |
            alire-${{ runner.os }}-

      # gnatcoll_gmp depends on the system "gmp" library. On this runner
      # alr's package-manager auto-install tries to apt-get a package named
      # plain "gmp", which does not exist on Ubuntu (forcing an explicit
      # distribution.override made no difference, so this isn't ordinary
      # distro misdetection). Installing libgmp-dev ourselves and disabling
      # alr's distribution detection sidesteps its system-package logic
      # entirely: alr then trusts the already-installed library instead of
      # trying (and failing) to install one itself.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgmp-dev
          alr settings --global --set distribution.disable_detection true

      # --verify's SMT backend needs cvc5 and z3 on PATH or under Alire's
      # standard GNATprove installation prefix (~/.alire/libexec/spark/bin);
      # without them, tests/run_verification.sh's external-prover checks
      # fail silently under `set -eu`.
      - name: Install SPARK solvers
        run: alr -n install gnatprove

      - name: Build
        run: alr build

      - name: Run test suite
        # Shared CI runners are slower and noisier than a local machine, so
        # relax the performance smoke test's threshold to avoid flaky
        # failures unrelated to an actual regression.
        env:
          ADALANG_MAX_SMOKE_SECONDS: 30
        run: sh tests/run_all.sh
