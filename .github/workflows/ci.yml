name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4
        with:
          version: "2.1.0"

      # Alire's shared cache holds fetched sources, unique dependency builds,
      # and downloaded toolchains keyed by lock file + environment, so most
      # runs only need to rebuild adalang_analyzer itself.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/alire
            ~/.alire
          key: alire-${{ runner.os }}-${{ hashFiles('alire.lock') }}
          restore-keys: |
            alire-${{ runner.os }}-

      # Alire's index maps the gnatcoll_gmp dependency to the "libgmp-dev"
      # apt package on Debian/Ubuntu, but on this runner Alire's distribution
      # autodetection doesn't resolve to "ubuntu", so its case(distribution)
      # lookup falls through to a generic "gmp" package name that apt does
      # not have. Forcing the override makes it match the debian|ubuntu
      # branch and correctly find libgmp-dev, which the runner image already
      # ships (installing it explicitly here too, for images that don't).
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libgmp-dev
          alr settings --global --set distribution.override ubuntu

      # --verify's SMT backend needs cvc5 and z3 on PATH or under Alire's
      # standard GNATprove installation prefix (~/.alire/libexec/spark/bin);
      # without them, tests/run_verification.sh's external-prover checks
      # fail silently under `set -eu`.
      - name: Install SPARK solvers
        run: alr -n install gnatprove

      - name: Build
        run: alr build

      - name: Run test suite
        # Shared CI runners are slower and noisier than a local machine, so
        # relax the performance smoke test's threshold to avoid flaky
        # failures unrelated to an actual regression.
        env:
          ADALANG_MAX_SMOKE_SECONDS: 30
        run: sh tests/run_all.sh
