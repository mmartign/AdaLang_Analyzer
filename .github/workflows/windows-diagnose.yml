name: Windows diagnose (temporary)

on:
  push:
    branches: [windows-objectada]

concurrency:
  group: windows-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line ends as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4
        with:
          version: "2.1.0"

      - name: Move Alire's cache to a short path
        run: |
          mkdir -p 'C:\temp\ac'
          alr settings --global --set cache.dir 'C:\temp\ac'
          alr settings --global --set toolchain.dir "$LOCALAPPDATA\\alire\\cache\\toolchains"
          alr settings --global --set msys2.install_dir "$LOCALAPPDATA\\alire\\cache\\msys64"

      - name: Install tar from MSYS2
        run: |
          "$LOCALAPPDATA\\alire\\cache\\msys64\\usr\\bin\\pacman" --noconfirm -S tar

      - name: Restore Alire's builds
        uses: actions/cache/restore@v4
        with:
          path: C:\temp\ac
          key: alire-builds-${{ runner.os }}-${{ hashFiles('alire.toml') }}-${{ github.run_id }}
          restore-keys: |
            alire-builds-${{ runner.os }}-${{ hashFiles('alire.toml') }}-
            alire-builds-${{ runner.os }}-

      - name: Build
        run: |
          alr build 2>&1 | tee build.txt | grep -E 'Partial|Archive|Link\]|Success|rror' | tail -20
          alr exec -- sh -c 'echo "LIBADALANG_STANDALONE=$LIBADALANG_STANDALONE LANGKIT_SUPPORT_STANDALONE=$LANGKIT_SUPPORT_STANDALONE"'

      - name: Write the checks
        run: |
          cat > "$RUNNER_TEMP/check.sh" <<'CHECK'
          check() {
            exe=$1
            base=$(alr exec -- objdump -p "$exe" | awk '/^ImageBase/ { print $2; exit }')
            alr exec -- objdump -p "$exe" | grep "DLL Name" | tr -d '\t' | paste -sd' ' -
            alr exec -- objdump -s -j .pdata "$exe" > pdata.txt
            alr exec -- nm "$exe" > nm.txt
            python -I tests/tools/pdata_check.py pdata.txt "$base" nm.txt | head -3
            timeout 300 "$exe" -q -checks=No_Goto tests/invalid_syntax.adb > out.txt 2>&1
            echo "=== invalid_syntax: exit $? (1 expected)"; tail -2 out.txt
            timeout 300 "$exe" --recommended tests/bug_findings.adb > out.txt 2>&1
            echo "=== --recommended bug_findings: exit $?, $(wc -l < out.txt) lines"; tail -2 out.txt
            timeout 300 env -i SYSTEMROOT="$SYSTEMROOT" LOCALAPPDATA="$LOCALAPPDATA" PATH=/usr/bin "$exe" -v --recommended tests/bug_findings.adb > out.txt 2>&1
            echo "=== bare environment, --recommended bug_findings: exit $?, $(wc -l < out.txt) lines"; grep -i 'gnatls\|INFO' out.txt | head -3
          }
          CHECK

      - name: As built, with the DLLs beside it
        continue-on-error: true
        run: |
          set +e
          dlls="$LOCALAPPDATA\\alire\\cache\\msys64\\mingw64\\bin"
          cp "$dlls\\libgmp-10.dll" "$dlls\\libiconv-2.dll" bin/
          . "$RUNNER_TEMP/check.sh"
          check bin/adalang_analyzer.exe

      - name: Linked with -static, alone in a folder
        continue-on-error: true
        run: |
          set +e
          alr exec -- gprbuild -q -P adalang_analyzer.gpr adalang_analyzer-driver.adb -o adalang_analyzer_static.exe -largs -static
          mkdir -p "$RUNNER_TEMP/alone"
          cp bin/adalang_analyzer_static.exe "$RUNNER_TEMP/alone/"
          . "$RUNNER_TEMP/check.sh"
          check "$RUNNER_TEMP/alone/adalang_analyzer_static.exe"
