name: Windows diagnose (temporary)

on:
  push:
    branches: [windows-objectada]

concurrency:
  group: windows-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line ends as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4
        with:
          version: "2.1.0"

      - name: Move Alire's cache to a short path
        run: |
          mkdir -p 'C:\temp\ac'
          alr settings --global --set cache.dir 'C:\temp\ac'
          alr settings --global --set toolchain.dir "$LOCALAPPDATA\\alire\\cache\\toolchains"
          alr settings --global --set msys2.install_dir "$LOCALAPPDATA\\alire\\cache\\msys64"

      - name: Install tar from MSYS2
        run: |
          "$LOCALAPPDATA\\alire\\cache\\msys64\\usr\\bin\\pacman" --noconfirm -S tar

      - name: Restore Alire's builds
        uses: actions/cache/restore@v4
        with:
          path: C:\temp\ac
          key: alire-builds-${{ runner.os }}-${{ hashFiles('alire.toml') }}-${{ github.run_id }}
          restore-keys: |
            alire-builds-${{ runner.os }}-${{ hashFiles('alire.toml') }}-
            alire-builds-${{ runner.os }}-

      - name: Build
        run: alr build

      - name: Put the GMP and iconv DLLs beside the executable
        run: |
          dlls="$LOCALAPPDATA\\alire\\cache\\msys64\\mingw64\\bin"
          cp "$dlls\\libgmp-10.dll" "$dlls\\libiconv-2.dll" bin/
          alr exec -- objdump -p bin/adalang_analyzer.exe | grep "DLL Name"

      - name: Function table and starts, as built
        continue-on-error: true
        run: |
          set +e
          cat > "$RUNNER_TEMP/check.sh" <<'CHECK'
          check() {
            exe=bin/adalang_analyzer.exe
            base=$(alr exec -- objdump -p $exe | awk '/^ImageBase/ { print $2; exit }')
            alr exec -- objdump -s -j .pdata $exe > pdata.txt
            alr exec -- nm $exe > nm.txt
            echo "image base $base, $(wc -l < pdata.txt) lines of .pdata"
            python -I tests/tools/pdata_check.py pdata.txt "$base" nm.txt
            timeout 300 alr exec -- ./bin/adalang_analyzer -q -checks=No_Goto tests/invalid_syntax.adb > out.txt 2>&1
            echo "=== alr exec, invalid_syntax: exit $?"; tail -3 out.txt
            timeout 300 ./bin/adalang_analyzer --recommended tests/bug_findings.adb > out.txt 2>&1
            echo "=== direct, --recommended bug_findings: exit $?, $(wc -l < out.txt) lines"; tail -3 out.txt
          }
          CHECK
          . "$RUNNER_TEMP/check.sh"
          check

      - name: Without the partial links of langkit_support and libadalang
        continue-on-error: true
        timeout-minutes: 45
        env:
          LANGKIT_SUPPORT_STANDALONE: "no"
          LIBADALANG_STANDALONE: "no"
        run: |
          set +e
          alr build 2>&1 | grep -E 'created|Partial|Archive|Link\]|Success|error' | head -30
          . "$RUNNER_TEMP/check.sh"
          check
