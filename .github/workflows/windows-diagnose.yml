name: Windows diagnose (temporary)

on:
  push:
    branches: [windows-objectada]

concurrency:
  group: windows-diagnose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep line ends as committed
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: alire-project/setup-alire@v4
        with:
          version: "2.1.0"

      - name: Move Alire's cache to a short path
        run: |
          mkdir -p 'C:\temp\ac'
          alr settings --global --set cache.dir 'C:\temp\ac'
          alr settings --global --set toolchain.dir "$LOCALAPPDATA\\alire\\cache\\toolchains"
          alr settings --global --set msys2.install_dir "$LOCALAPPDATA\\alire\\cache\\msys64"

      - name: Install tar from MSYS2
        run: |
          "$LOCALAPPDATA\\alire\\cache\\msys64\\usr\\bin\\pacman" --noconfirm -S tar

      - name: Restore Alire's builds
        uses: actions/cache/restore@v4
        with:
          path: C:\temp\ac
          key: alire-builds-${{ runner.os }}-${{ hashFiles('alire.toml') }}-${{ github.run_id }}
          restore-keys: |
            alire-builds-${{ runner.os }}-${{ hashFiles('alire.toml') }}-
            alire-builds-${{ runner.os }}-

      - name: Build
        run: alr build

      - name: Put the GMP and iconv DLLs beside the executable
        run: |
          dlls="$LOCALAPPDATA\\alire\\cache\\msys64\\mingw64\\bin"
          cp "$dlls\\libgmp-10.dll" "$dlls\\libiconv-2.dll" bin/
          alr exec -- objdump -p bin/adalang_analyzer.exe | grep "DLL Name"

      - name: Start the analyzer four ways
        continue-on-error: true
        run: |
          set +e
          T="$LOCALAPPDATA\\alire\\cache\\toolchains"
          tu=$(cygpath -u "$T")
          g16="$tu/$(ls "$T" | grep '^gnat_native_16' | head -1)/bin"
          g15="$tu/$(ls "$T" | grep '^gnat_native_15' | head -1)/bin"
          run() {
            label=$1; shift
            timeout 300 "$@" -v -checks=No_Goto tests/invalid_syntax.adb > out.txt 2>&1
            echo "=== $label: exit $?"
            tail -4 out.txt
          }
          run "alr exec" alr exec -- ./bin/adalang_analyzer
          run "direct" ./bin/adalang_analyzer
          PATH="$g16:$PATH" run "gnat 16 first on PATH" ./bin/adalang_analyzer
          PATH="$g15:$PATH" run "gnat 15 first on PATH" ./bin/adalang_analyzer
          env -i SYSTEMROOT="$SYSTEMROOT" PATH=/usr/bin ./bin/adalang_analyzer -q -checks=No_Goto tests/invalid_syntax.adb > out.txt 2>&1
          echo "=== bare environment: exit $?"; tail -3 out.txt
          ./bin/adalang_analyzer --recommended tests/bug_findings.adb > out.txt 2>&1
          echo "=== --recommended bug_findings.adb: exit $?, $(wc -l < out.txt) lines"
          tail -5 out.txt

      - name: Build hash inputs, bash and sh
        continue-on-error: true
        run: |
          set +e
          for f in C:/temp/ac/builds/vss_text_*/*/alire/build_hash_inputs; do echo "== $f"; cat "$f"; done
          timeout 90 sh -c 'alr build' > sh-build.txt 2>&1
          echo "sh build: exit $?"; grep -E 'created|Building' sh-build.txt | head
          for f in C:/temp/ac/builds/vss_text_*/*/alire/build_hash_inputs; do echo "== $f"; cat "$f"; done
